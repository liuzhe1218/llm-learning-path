site_name: LLM Learning Path
site_description: A curated, bilingual (English / 中文) learning path for LLM pre-training, post-training, and inference systems — with paper links and summaries.
# Update these two lines if you fork / rename the repo
site_url: https://liuzhe1218.github.io/llm-learning-path/
repo_url: https://github.com/liuzhe1218/llm-learning-path
repo_name: llm-learning-path
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.prev_next
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_name: LLM 学习路线
          nav_translations:
            Home: 首页
            "Part 1 · Pre-training & Architecture": "第一部分 · 预训练与模型架构"
            "Part 2 · Post-training & Reasoning": "第二部分 · 后训练与推理能力"
            "Part 3 · Inference Systems & Infra": "第三部分 · 推理系统与基础设施"
            "Part 4 · LLMs in Ads & Recommendation": "第四部分 · LLM 与广告推荐系统"

nav:
  - Home: index.md
  - "Part 1 · Pre-training & Architecture":
    - part1/index.md
    - part1/01-language-modeling.md
    - part1/02-tokenization.md
    - part1/03-transformer.md
    - part1/04-modern-block.md
    - part1/05-mixture-of-experts.md
    - part1/06-long-context-and-efficient-attention.md
    - part1/07-scaling-laws-and-data.md
    - part1/08-training-at-scale.md
    - part1/09-frontier-model-case-studies.md
  - "Part 2 · Post-training & Reasoning":
    - part2/index.md
    - part2/01-why-post-training.md
    - part2/02-supervised-fine-tuning.md
    - part2/03-rl-foundations-for-llms.md
    - part2/04-rlhf.md
    - part2/05-direct-preference-optimization.md
    - part2/06-reasoning-and-test-time-compute.md
    - part2/07-rl-with-verifiable-rewards.md
    - part2/08-distillation-and-efficient-fine-tuning.md
    - part2/09-agents-tool-use-and-safety.md
  - "Part 3 · Inference Systems & Infra":
    - part3/index.md
    - part3/01-inference-fundamentals.md
    - part3/02-kv-cache.md
    - part3/03-batching-and-memory-management.md
    - part3/04-attention-kernels.md
    - part3/05-speculative-decoding.md
    - part3/06-quantization.md
    - part3/07-distributed-and-disaggregated-serving.md
    - part3/08-engines-and-production-practice.md
  - "Part 4 · LLMs in Ads & Recommendation":
    - part4/index.md
    - part4/01-recsys-fundamentals.md
    - part4/02-ranking-and-ctr-models.md
    - part4/03-sequential-user-modeling.md
    - part4/04-scaling-recommendation-models.md
    - part4/05-semantic-ids-and-generative-retrieval.md
    - part4/06-end-to-end-generative-recommenders.md
    - part4/07-llms-in-recommendation.md
    - part4/08-ads-systems.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
